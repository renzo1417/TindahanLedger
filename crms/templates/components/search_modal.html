<dialog id="search-modal" class="app-dialog" aria-labelledby="search-title">
  <div class="dialog-header">
<h2 id="search-title">Search your store</h2>
<button type="button" data-close-dialog>Close</button>
</div>
  <label class="sr-only" for="global-search-input">Customer, product, SKU or phone</label>
  <input id="global-search-input" type="search" placeholder="Customer, product, SKU or phone" data-search-url="{% url 'search' %}" autocomplete="off" autofocus>
  <div id="global-search-results" class="search-results" aria-live="polite">
<p class="muted">Start typing to find a customer or product.</p>
</div>
</dialog>
