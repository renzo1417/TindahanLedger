{% if field.field.widget.input_type == 'checkbox' %}
<div class="field checkbox-field{% if field.errors %} has-error{% endif %}">
<label class="checkbox-label" for="{{ field.id_for_label }}">{{ field }}<span>{{ field.label }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}</span></label>{{ field.errors }}
</div>
{% else %}
<div class="field{% if field.errors %} has-error{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}{{ field.errors }}</div>
{% endif %}
